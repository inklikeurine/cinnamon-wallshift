<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Monitor frame -->
  <rect x="1" y="2" width="14" height="10" rx="1" ry="1"
        fill="none" stroke="currentColor" stroke-width="1.2"/>
  <!-- Stand -->
  <line x1="8" y1="12" x2="8" y2="14" stroke="currentColor" stroke-width="1.2"/>
  <line x1="5.5" y1="14" x2="10.5" y2="14" stroke="currentColor" stroke-width="1.2"/>
  <!-- Mountain silhouette (landscape hint) -->
  <polyline points="2,11 5,6 7.5,9 9.5,7 14,11"
            fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
  <!-- Sun -->
  <circle cx="12" cy="5" r="1.3" fill="currentColor"/>
</svg>
